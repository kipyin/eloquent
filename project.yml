name: Eloquent
options:
  bundleIdPrefix: com.kipyin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
fileGroups:
  - Config
  - ci_scripts
  - ExportOptions-DeveloperID.plist
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
targets:
  Eloquent:
    type: application
    platform: macOS
    sources:
      - path: Eloquent
        excludes:
          - Info.plist
          - "*.entitlements"
    configFiles:
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kipyin.eloquent
        PRODUCT_NAME: Eloquent
        INFOPLIST_FILE: Eloquent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Eloquent/Eloquent.entitlements
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SUPPORTED_PLATFORMS: macosx
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Public SemVer, no leading v. Lockstep with git tags. See docs/release.md.
        MARKETING_VERSION: "0.1.5"
        # Build number. Independent of MARKETING_VERSION. Simple integer.
        CURRENT_PROJECT_VERSION: 1
      configs:
        debug:
          CODE_SIGN_IDENTITY: "-"
          ENABLE_HARDENED_RUNTIME: NO
        release:
          # Team and Developer ID identity come from Release-Signing.xcconfig.
          # Cloud's command-line CODE_SIGN_IDENTITY=- still overrides that file.
          # ci_post copies CI_DEVELOPER_ID_SIGNED_APP_PATH when Notarize sets it,
          # and codesigns only when that variable is missing or empty.
          ENABLE_HARDENED_RUNTIME: YES
  EloquentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EloquentTests
      # Domain-only: no AppKit/SwiftUI/Carbon, so xctest is not an AppKit process.
      - path: Eloquent/AppProcess.swift
      - path: Eloquent/Settings/AppSettings.swift
      - path: Eloquent/Settings/KeychainStore.swift
      - path: Eloquent/Hotkey/HotkeyBinding.swift
      - path: Eloquent/TTS/ParagraphSplitter.swift
      - path: Eloquent/TTS/TTSClient.swift
      - path: Eloquent/TTS/ClipboardReading.swift
      - path: Eloquent/TTS/SelectionReading.swift
      - path: Eloquent/Playback/SpeechController.swift
      - path: Eloquent/Playback/AudioPlayback.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kipyin.eloquent.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SUPPORTED_PLATFORMS: macosx
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: 1
schemes:
  Eloquent:
    build:
      targets:
        Eloquent:
          - running
          - profiling
          - archiving
          - analyzing
        EloquentTests:
          - testing
          - analyzing
    run:
      config: Debug
    test:
      config: Debug
      debugEnabled: false
      gatherCoverageData: false
      targets:
        - name: EloquentTests
          parallelizable: false
      testPlans:
        - path: Eloquent.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release
