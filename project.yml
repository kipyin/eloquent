name: Eloquent
options:
  bundleIdPrefix: com.kipyin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
targets:
  Eloquent:
    type: application
    platform: macOS
    sources:
      - path: Eloquent
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kipyin.eloquent
        PRODUCT_NAME: Eloquent
        INFOPLIST_FILE: Eloquent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Eloquent/Eloquent.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SUPPORTED_PLATFORMS: macosx
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets:
        - name: EloquentTests
          parallelizable: true
  EloquentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EloquentTests
      # Logic tests in the xctest process — not TEST_HOST into Eloquent.app.
      # main.swift is the app entry point (NSApplicationMain).
      - path: Eloquent
        excludes:
          - Info.plist
          - "*.entitlements"
          - main.swift
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kipyin.eloquent.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SUPPORTED_PLATFORMS: macosx
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
