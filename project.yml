name: ClipboardTTS
options:
  bundleIdPrefix: com.kipyin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
targets:
  ClipboardTTS:
    type: application
    platform: macOS
    sources:
      - path: ClipboardTTS
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kipyin.clipboard-tts
        PRODUCT_NAME: ClipboardTTS
        INFOPLIST_FILE: ClipboardTTS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ClipboardTTS/ClipboardTTS.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ARCHS: arm64
        SUPPORTED_PLATFORMS: macosx
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
    scheme: {}
